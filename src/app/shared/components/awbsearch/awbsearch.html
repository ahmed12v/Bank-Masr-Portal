<div class="container-fluid py-4">

  <!-- Header -->
  <div class="card shadow-sm border-0 rounded-4 p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

      <div class="d-flex align-items-center gap-3">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <h2 class="mb-0 page-title">AWB Search Panel</h2>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-light action-btn">
          <i class="fa-regular fa-file-excel me-2"></i>
          Export Matrix
        </button>

        <button class="btn btn-light action-btn">
          <i class="fa-solid fa-rotate-right me-2"></i>
          Reset Display
        </button>
      </div>

    </div>

  </div>

  <!-- Search Form -->
  <div class="card shadow-sm border-0 rounded-4 p-4 mb-4">

    <div class="row g-4">

      <div class="col-lg-3 col-md-6">
        <label class="form-label">DATE FROM</label>
        <input type="date" class="form-control custom-input">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">DATE TO</label>
        <input type="date" class="form-control custom-input">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">SHIPPER ACCOUNT NAME</label>
        <input type="text" class="form-control custom-input"
          placeholder="Search by Shipper Name">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">CONSIGNEE NAME</label>
        <input type="text" class="form-control custom-input"
          placeholder="Search by Consignee">
      </div>

      <!-- Row 2 -->
      <div class="col-lg-3 col-md-6">
        <label class="form-label">AWB RANGE FROM</label>
        <input type="text" class="form-control custom-input"
          placeholder="e.g. AWB001">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">AWB RANGE TO</label>
        <input type="text" class="form-control custom-input"
          placeholder="e.g. AWB100">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">SHIPMENT REFERENCE</label>
        <input type="text" class="form-control custom-input"
          placeholder="Ref Tracking Code">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">BOOKING REFERENCE NUMBER</label>
        <input type="text" class="form-control custom-input"
          placeholder="Booking Ref No">
      </div>

      <!-- Row 3 -->
      <div class="col-lg-3 col-md-6">
        <label class="form-label">SHIPPER PHONE NO</label>
        <input type="text" class="form-control custom-input"
          placeholder="Mobile / Landline">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">CONSIGNEE TEL NO</label>
        <input type="text" class="form-control custom-input"
          placeholder="Mobile / Landline">
      </div>

      <div class="col-lg-1 col-md-6">
        <label class="form-label">ORIGIN</label>
        <input type="text" class="form-control custom-input"
          placeholder="ORG">
      </div>

      <div class="col-lg-1 col-md-6">
        <label class="form-label">DEST</label>
        <input type="text" class="form-control custom-input"
          placeholder="DST">
      </div>

      <div class="col-lg-4 col-md-12">
        <label class="form-label">GOODS DESCRIPTION</label>
        <input type="text" class="form-control custom-input"
          placeholder="Package Cargo Items">
      </div>

      <!-- Row 4 -->
      <div class="col-lg-3 col-md-6">
        <label class="form-label">SPECIAL INSTRUCTION</label>
        <input type="text" class="form-control custom-input"
          placeholder="Handling rules">
      </div>

      <div class="col-lg-2 col-md-6">
        <label class="form-label">PRODUCT</label>
        <input type="text" class="form-control custom-input">
      </div>

      <div class="col-lg-2 col-md-6">
        <label class="form-label">SERVICE</label>
        <input type="text" class="form-control custom-input">
      </div>

      <div class="col-lg-2 col-md-6">
        <label class="form-label">WT FROM</label>
        <input type="text" class="form-control custom-input"
          placeholder="0.00">
      </div>

      <div class="col-lg-2 col-md-6">
        <label class="form-label">WT TO</label>
        <input type="text" class="form-control custom-input"
          placeholder="99.9">
      </div>

      <div class="col-lg-3 col-md-6">
        <label class="form-label">SHIPMENT STATUS</label>

        <div class="d-flex gap-3">
          <select class="form-select custom-input">
            <option>All Shipments</option>
          </select>

          <button class="btn execute-btn">
            <i class="fa-solid fa-magnifying-glass me-2"></i>
            Execute Query
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- Table -->
  <div class="card shadow-sm border-0 rounded-4">

    <div class="table-responsive">

      <table class="table mb-0">
        <thead>
          <tr>
            <th>Pickup Date</th>
            <th>AWB No.</th>
            <th>Shipper Ref</th>
            <th>Shipper Account</th>
            <th>Consignee Client</th>
            <th>Origin</th>
            <th>Dest</th>
            <th>Weight</th>
            <th>Last Status</th>
          </tr>
        </thead>

        <tbody>

    </div>

  </div>
