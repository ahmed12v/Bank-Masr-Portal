<div class="audit-desk">

  <!-- =========================================================
       Header
  ========================================================== -->

  <div class="card-panel header-panel">

    <div class="header-content">

      <div>

        <h2 class="page-title">
          AWB Search Panel
        </h2>

        <p class="page-subtitle">
          Search shipment information using advanced filters and export the results when needed.
        </p>

      </div>

      <div class="d-flex gap-2 flex-wrap">

        <button type="button" class="btn-reset">
          <i class="fa-solid fa-rotate-right"></i>
          Reset Display
        </button>

        <button type="button" class="add-btn">
          <i class="fa-regular fa-file-excel"></i>
          Export Matrix
        </button>

      </div>

    </div>

  </div>

  <!-- =========================================================
       Search Filters
  ========================================================== -->

  <div class="card-panel filters-panel d-none">

    <div class="row g-4">

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Date From
        </label>

        <input
          type="date"
          class="field-input">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Date To
        </label>

        <input
          type="date"
          class="field-input">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Shipper Account Name
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Search by shipper name">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Consignee Name
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Search by consignee">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          AWB Range From
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="AWB0001">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          AWB Range To
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="AWB9999">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Shipment Reference
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Reference Number">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Booking Reference
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Booking Number">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Shipper Phone
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Phone Number">

      </div>

      <div class="col-lg-3 col-md-6">

        <label class="field-label">
          Consignee Phone
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Phone Number">

      </div>

      <div class="col-lg-1 col-md-6">

        <label class="field-label">
          Origin
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-1 col-md-6">

        <label class="field-label">
          Dest
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-4">

        <label class="field-label">
          Goods Description
        </label>

        <input
          type="text"
          class="field-input"
          placeholder="Shipment description">

      </div>

      <div class="col-lg-3">

        <label class="field-label">
          Special Instruction
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-2">

        <label class="field-label">
          Product
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-2">

        <label class="field-label">
          Service
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-2">

        <label class="field-label">
          Weight From
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-2">

        <label class="field-label">
          Weight To
        </label>

        <input
          type="text"
          class="field-input">

      </div>

      <div class="col-lg-3">

        <label class="field-label">
          Shipment Status
        </label>

        <select class="field-input">
          <option>All Shipments</option>
        </select>

      </div>

      <div class="col-lg-3 d-flex align-items-end">

        <button class="btn-query w-100">

          <i class="fa-solid fa-magnifying-glass"></i>

          Execute Query

        </button>

      </div>

    </div>

  </div>

  <!-- =========================================================
       Results
  ========================================================== -->

  <div class="card-panel results-panel">

    <div class="table-responsive">

      <table class="table results-table mb-0">

        <thead>

          <tr>

            <th>Pickup Date</th>
            <th>AWB No.</th>
            <th>Shipper Ref</th>
            <th>Shipper Account</th>
            <th>Consignee Client</th>
            <th>Origin</th>
            <th>Destination</th>
            <th>Weight</th>
            <th>Last Status</th>

          </tr>

        </thead>

        <tbody>

          <!-- Data Here -->

          <tr>

            <td colspan="9">

              <div class="empty-state">

                <!-- <i class="fa-regular fa-folder-open empty-icon"></i> -->

                <h5 class="empty-title">
                  No shipment records found
                </h5>

                <p class="empty-subtitle">
                  Configure the required search filters then execute the query.
                </p>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
